services:
  vmrt-emr-process-log-mysql:
    env_file:
      - path: ./.env
        required: true
    container_name: vmrt-emr-process-log-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $SQL_PASSWORD
  vmrt-emr-workspace:
    container_name: vmrt-emr-workspace
    # Prebuilt by .github/workflows/docker_image.yaml; `./run.sh --build` builds it locally instead.
    image: ghcr.io/morrisanimalfoundation/vmrt_tesseract_utilities:main
    build: .
    # Run as the host user so files written to ./output belong to you. run.sh sets these.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: tail -f /dev/null
    volumes:
      - ./:/workspace
      - emr-source:/data

volumes:
  emr-source:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "$HOME/MAF\ Dropbox/GRLS/Operations/ENROLLED\ DOGS"