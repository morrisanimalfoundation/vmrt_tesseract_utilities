[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmrt_tesseract_utilities"
version = "1.0"
description = "A utility script for extracting text and scrubbing PII from EMR data."
license = "Apache-2.0"
authors = [
  {name = "Morris Animal Foundation", email = "information-systems@morrisanimalfoundation.org"},
]

[tool.setuptools]
packages=["vmrt_tesseract_utilities"]

# Used by `pytest --cov` (pytest-cov). scripts/ has no __init__.py files, so its folders are namespace packages,
# which coverage only reports files from (including files no test ran) with include_namespace_packages.
[tool.coverage.run]
source = ["vmrt_tesseract_utilities", "scripts"]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
skip_empty = true
